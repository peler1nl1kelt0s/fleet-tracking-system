apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-tracking-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/peler1nl1kelt0s/fleet-tracking-system.git
    targetRevision: dev
    path: k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
