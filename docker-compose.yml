version: '3.8'

services:
  # Database Service: PostgreSQL + TimescaleDB + PostGIS
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: fleet_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fleet_tracking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fleet_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Service: Cache & Message Queue
  redis:
    image: redis:alpine
    container_name: fleet_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fleet_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Placeholder for future services (as per project structure)
  # ingestion-service: ...
  # worker-service: ...
  # realtime-api: ...
  # frontend: ...

networks:
  fleet_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
