name: Build and Push Docker Images
on:
  push:
    branches: [ "dev" ]
env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}-backend:${{ github.sha }}
          no-cache: true

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front-end/fleet-tracking-system
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}-frontend:${{ github.sha }}
          no-cache: true

      - name: Update Kubernetes manifests
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          sed -i "s|image: ghcr.io/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}-backend:.*|image: ghcr.io/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}-backend:${{ github.sha }}|" k3s/backend.yaml
          
          sed -i "s|image: ghcr.io/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}-frontend:.*|image: ghcr.io/${{ env.IMAGE_OWNER }}/${{ github.event.repository.name }}-frontend:${{ github.sha }}|" k3s/frontend.yaml
          
          git add k3s/backend.yaml k3s/frontend.yaml
          git commit -m "Update image tags to ${{ github.sha }}"
          git push